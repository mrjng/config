# Fedora Asahi runs natively on KDE Wayland.
linux_display_server wayland
wayland_titlebar_color system

# Fedora fontconfig resolves all four selected Meslo faces automatically.
font_family MesloLGS Nerd Font Mono

# Clipboard shortcuts remain Kitty defaults: Ctrl+Shift+C and Ctrl+Shift+V.
# Zellij will own panes, tabs, sessions, and layouts.
font_size 10.0
