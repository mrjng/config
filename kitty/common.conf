# Shared Kitty appearance and behavior.
# Reuse the preserved Monokai Soda theme at its deployment-compatible path.
include work/current-theme.conf

# Use a portable fallback; platform profiles can select a verified family.
font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Keep plain-text URL discovery available.
detect_urls yes

# Retain modest spacing without imposing a platform-specific window layout.
window_padding_width 8
inactive_text_alpha 0.9

# Optional after a physical bell test; leave inactive until then.
# enable_audio_bell no
