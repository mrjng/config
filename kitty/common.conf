# Shared Kitty appearance and behavior.
include work/current-theme.conf

# Use the system monospace family until a Nerd Font is selected and verified.
font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# Keep plain-text URL discovery available.
detect_urls yes

# Retain modest spacing without imposing a platform-specific window layout.
window_padding_width 8
inactive_text_alpha 0.9

# Optional after a physical bell test; leave inactive until then.
# enable_audio_bell no
