# macOS-only Kitty settings. Shared behavior is loaded by kitty.conf.

# Match the installed four-face family and retain the legacy macOS size.
font_family MesloLGS NF
font_size 14.0

# Preserve left Option as Alt while retaining right Option for macOS input.
macos_option_as_alt left

# Portable appearance; the personal wallpaper path belongs in macos.local.conf.
background_opacity 0.8
background_image_layout scaled
background_tint 0.95

# Optional, unmanaged host-local settings next to the deployed symlinks.
globinclude macos.local.conf

# Keep Kitty's macOS defaults for Cmd+C/V and macOS-style tabs. Do not claim
# Ctrl+Space, Ctrl+Option+Space, or Ctrl+Arrow; macOS owns those shortcuts.
